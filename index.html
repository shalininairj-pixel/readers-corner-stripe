<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Reader's Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root{--paper:#f6efe3;--card:#fffaf0;--ink:#2e2118;--wood:#7a4b2a;--wood-dark:#5c3519;--line:#e0d3bd;--muted:#7b6a58}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Lora',Georgia,serif;line-height:1.6}
  header{text-align:center;padding:48px 16px 28px;border-bottom:2px solid var(--line)}
  header h1{font-family:'Playfair Display',Georgia,serif;font-size:2.6rem;margin:0;color:var(--wood-dark);letter-spacing:.5px}
  header p{margin:6px 0 0;font-style:italic;color:var(--muted)}
  main{max-width:900px;margin:0 auto;padding:32px 16px 60px}
  h2{font-family:'Playfair Display',Georgia,serif;color:var(--wood-dark)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
  .book{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:0 3px 10px rgba(92,53,25,.08);display:flex;flex-direction:column}
  .cover{height:220px;border-radius:3px 8px 8px 3px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;box-shadow:inset 8px 0 0 rgba(0,0,0,.18),3px 4px 8px rgba(0,0,0,.2)}
  .cover b{font-family:'Playfair Display',Georgia,serif;font-size:1.35rem;line-height:1.25}
  .cover span{margin-top:10px;font-size:.85rem;letter-spacing:1px;text-transform:uppercase}
  .meta{margin:14px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .meta .t{font-weight:500}.meta .p{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--wood-dark)}
  .meta .a{color:var(--muted);font-size:.9rem}
  button{background:var(--wood);color:#fff;border:0;border-radius:4px;padding:11px 20px;font:500 1rem 'Lora',Georgia,serif;cursor:pointer;transition:background .2s}
  button:hover{background:var(--wood-dark)} button:disabled{opacity:.5;cursor:wait}
  button.ghost{background:transparent;color:var(--wood);border:1px solid var(--wood)}
  #checkout,#confirmation{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px;box-shadow:0 3px 10px rgba(92,53,25,.08)}
  .err{color:#a3262a;margin-top:12px}.muted{color:var(--muted);font-size:.9rem}
  code{background:#efe4d0;padding:2px 8px;border-radius:4px;font-size:.95rem}
  .overlay{position:fixed;inset:0;background:rgba(46,33,24,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
  .overlay[hidden]{display:none}
  .pay-box{background:#fff;border-radius:14px;border-top:6px solid #635bff;padding:34px 44px 28px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .pay-box img{height:60px;max-width:100%}
  #stripe-word{display:none;font:800 3rem/1 'Helvetica Neue',Arial,sans-serif;letter-spacing:-1.5px;color:#635bff;margin:0}
  .spinner{width:50px;height:50px;border:5px solid #e3e0ff;border-top-color:#635bff;border-radius:50%;animation:spin .9s linear infinite;margin:22px auto 18px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .secure{display:inline-block;background:#efedff;color:#4b43d6;border-radius:20px;padding:4px 14px;font-size:.85rem;margin-top:10px}
  a{color:var(--wood)} footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}
</style>
</head>
<body>
<header>
  <h1>📖 The Reader's Corner</h1>
  <p>A quiet little shelf for stories worth staying up for</p>
</header>
<main>
  <div id="catalog"></div>
  <div id="checkout" hidden>
    <h2 id="checkout-title"></h2>
    <form id="payment-form">
      <div id="payment-element"></div>
      <div style="margin-top:18px">
        <button type="button" id="pay-btn">Pay now</button>
        <button type="button" id="back-btn" class="ghost">Back to shelf</button>
      </div>
      <div id="error" class="err"></div>
    </form>
    <p class="muted">Test card: 4242 4242 4242 4242 · any future date · any CVC</p>
  </div>
  <div id="confirmation" hidden></div>
</main>
<div id="overlay" class="overlay" hidden>
  <div class="pay-box">
    <img src="stripe-logo.svg" alt="Stripe" onerror="this.style.display='none';document.getElementById('stripe-word').style.display='block'">
    <p id="stripe-word">stripe</p>
    <div class="spinner"></div>
    <h2 style="margin:0;color:#2e2118">Processing your payment…</h2>
    <p class="muted" style="margin:8px 0 0">Please don't close or refresh this page</p>
    <span class="secure">🔒 Secured by Stripe</span>
  </div>
</div>
<footer>© The Reader's Corner · Payments secured by Stripe (test mode)</footer>
<script src="script.js?v=3"></script>
</body>
</html>
